[www]
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; The sendmail shim reads its relay credentials from the process environment, and php-fpm
; scrubs the environment from its workers by default — leaving every notification, password
; reset and registration mail to fail authentication.
clear_env = no

; Worker output belongs in the container log rather than a file nobody reads.
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

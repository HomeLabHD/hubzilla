worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    # Everything nginx writes goes to /tmp so the root filesystem can stay read-only.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;
    keepalive_timeout 65;

    # Redirects are relative so the container's own port never leaks into a Location header.
    absolute_redirect off;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml application/javascript application/json
                      application/xml application/rss+xml application/activity+json
                      application/jrd+json application/xrd+xml image/svg+xml;

    # A hub records the address behind every registration, login and report, so it needs the
    # caller and not the proxy in front of it. Private ranges only: a header from anywhere
    # else is an assertion the sender is not entitled to make.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 100.64.0.0/10;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # Hubzilla marks its session cookie SameSite=None and only adds Secure when PHP sees
    # HTTPS, and browsers discard a SameSite=None cookie that is not Secure. TLS terminates
    # in front of this container, so nginx's own $https is empty and the proxy's verdict is
    # what PHP has to be told.
    map $http_x_forwarded_proto $fcgi_https {
        default on;
        http    "";
        https   on;
    }

    server {
        listen 8080;
        server_name _;
        root /var/www/html;
        index index.php;

        client_max_body_size 100m;
        client_body_buffer_size 128k;

        # Discovery — webfinger, host-meta, nodeinfo — is answered by Hubzilla, and has to
        # route even when a file of that name exists.
        location ^~ /.well-known/ {
            try_files $uri /index.php?q=$uri&$args;
        }

        # Uploads are served through Hubzilla's controllers, which is what applies the
        # per-object permissions. Reaching store/ directly bypasses them, and reaching it
        # through the PHP handler turns an upload into code execution.
        location ^~ /store/ {
            return 404;
        }

        # Command-line maintenance scripts, not endpoints.
        location ^~ /util/ {
            return 404;
        }

        # Dotfiles, .htconfig.php among them, hold the database credentials.
        location ~ /\. {
            return 404;
        }

        # Smarty templates, logs and archives are readable files inside the webroot.
        location ~* \.(bak|tpl|tgz|log|out)$ {
            return 404;
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
            try_files $uri /index.php?q=$uri&$args;
        }

        # Hubzilla does not fingerprint its assets, so a far-future expiry would survive an
        # upgrade and leave browsers on the previous theme.
        location ~* \.(jpg|jpeg|gif|png|ico|css|js|map|ttf|woff|woff2|svg)$ {
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
            try_files $uri /index.php?q=$uri&$args;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param HTTPS $fcgi_https;
            # Hubzilla's cloud storage (DAV) and API authenticate with HTTP Basic. Upstream's
            # .htaccess forwards the header as REMOTE_USER; without it those log in as nobody.
            fastcgi_param REMOTE_USER $http_authorization;
            fastcgi_read_timeout 120;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        location / {
            try_files $uri /index.php?q=$uri&$args;
        }
    }
}

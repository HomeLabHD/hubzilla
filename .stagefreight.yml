metadata:
  category: applications
  description:
    - Hubzilla and its official addons, built at a pinned upstream revision.
    - Container image for Hubzilla, a federated social platform with nomadic identity and per-object permissions, carrying the official addon set so ActivityPub federation is available rather than Zot alone.
  license: MIT
  org: HomeLabHD
  title: Hubzilla
  topics:
    - hubzilla
    - fediverse
    - activitypub
    - zot
    - nomadic-identity
    - docker
orgs:
  HomeLabHD:
    aliases:
      docker: hlhd
      ghcr: homelabhd
      github: HomeLabHD
      handle: hlhd
    maintainer: HomeLabHD <homelabhelp@gmail.com>
publish:
  dev:
    tags:
      - dev-{sha:8}
      - latest-dev
      - latest-v11-dev
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/publish-docker.yml
  stable:

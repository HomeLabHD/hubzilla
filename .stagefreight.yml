repos:
  github-mirror:
    forge: github
    project: HomeLabHD/hubzilla
    roles:
      - mirror
      - publish-origin
    sync:
      git: true
      releases: true
  primary:
    branches:
      default: main
    forge: gitlab
    project: HomeLabHD/hubzilla
    roles:
      - primary
    worktree: .
